<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Time Zone Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="./css/time-zone-explorer.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="./js/CoordinatesConverter.js"></script>
    <script src="./js/Events.js"></script>
    <script src="./js/HtmlElements.js"></script>
    <script src="./js/TimeConverter.js"></script>
    <script src="./js/TimeZone.js"></script>
    <script src="./js/TimeZoneExplorer.js"></script>
</head>
<body onload="TimeZoneExplorer.main();">
<header>
    <h1>Time Zone Explorer</h1>
</header>
<aside>
    <div id="map"></div>
</aside>
<nav>
    <label for="region">Region:</label>
    <select id="region">
        <option value="">Any</option>
    </select>
    <label for="subregion">Subregion:</label>
    <input type="search" id="subregion"/>
    <label for="country">Country:</label>
    <select id="country">
        <option value="">Any</option>
    </select>
    <label for="city">City:</label>
    <input type="search" id="city"/>
    <label for="offset">Offset:</label>
    <select id="offset">
        <option value="">Any</option>
    </select>
    <label for="dst">DST:</label>
    <select id="dst">
        <option value="">Any</option>
    </select>
    <label for="savings">Savings:</label>
    <select id="savings">
        <option value="">Any</option>
    </select>
    <button id="clear">Clear All</button>
</nav>
<main>
    <table>
        <thead>
        <tr>
            <td>ID</td>
            <td>Region</td>
            <td>Subregion</td>
            <td>Country</td>
            <td>City</td>
            <td>Latitude</td>
            <td>Longitude</td>
            <td>Offset</td>
            <td>DST</td>
            <td>Savings</td>
        </tr>
        </thead>
        <tbody id="zones"></tbody>
        <tfoot>
        <tr>
            <td id="count" colspan="10">&nbsp;</td>
        </tr>
        </tfoot>
    </table>
</main>
<footer>
    <p>Time Zone Explorer<br/>© Thanos Papapetrou, 2026</p>
</footer>
</body>
</html>
